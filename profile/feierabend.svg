<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <!-- Styles & Animations -->
    <style>
      @keyframes snowfall {
        0% { transform: translateY(-10px) translateX(0); opacity: 0; }
        15% { opacity: 0.9; }
        85% { opacity: 0.9; }
        100% { transform: translateY(280px) translateX(15px); opacity: 0; }
      }
      @keyframes snowfall-alt {
        0% { transform: translateY(-10px) translateX(0); opacity: 0; }
        15% { opacity: 0.9; }
        85% { opacity: 0.9; }
        100% { transform: translateY(280px) translateX(-15px); opacity: 0; }
      }
      @keyframes steamFloat {
        0% { transform: translateY(0) scale(1); opacity: 0; }
        25% { opacity: 0.6; }
        100% { transform: translateY(-50px) scale(1.5); opacity: 0; }
      }
      @keyframes steamFloatSmall {
        0% { transform: translateY(0) scale(0.8); opacity: 0; }
        25% { opacity: 0.4; }
        100% { transform: translateY(-30px) scale(1.2); opacity: 0; }
      }
      @keyframes baristaBob {
        0%, 100% { transform: translateY(0) translateX(0); }
        50% { transform: translateY(-3px) translateX(-8px); }
      }
      @keyframes armMove {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(-25deg); }
      }
      @keyframes flicker {
        0%, 100% { opacity: 0.9; }
        50% { opacity: 1; }
        75% { opacity: 0.85; }
      }
      
      /* Snow Element Classes */
      .snow { fill: #ffffff; opacity: 0; }
      .s1 { animation: snowfall 3s linear infinite; }
      .s2 { animation: snowfall-alt 4s linear infinite; }
      .s3 { animation: snowfall 3.5s linear infinite; }
      .s4 { animation: snowfall-alt 4.5s linear infinite; }
      
      /* Delays for randomizing snow */
      .d-0 { animation-delay: 0s; }
      .d-1 { animation-delay: 0.5s; }
      .d-2 { animation-delay: 1.2s; }
      .d-3 { animation-delay: 1.8s; }
      .d-4 { animation-delay: 2.5s; }
      .d-5 { animation-delay: 3.1s; }

      /* Steam Classes */
      .steam { fill: none; stroke: #f0f0f0; stroke-linecap: round; stroke-width: 4; }
      .st-1 { animation: steamFloat 2.5s ease-in-out infinite 0s; }
      .st-2 { animation: steamFloat 2.5s ease-in-out infinite 0.8s; }
      .st-3 { animation: steamFloat 2.5s ease-in-out infinite 1.5s; }
      
      .st-sm-1 { animation: steamFloatSmall 2s ease-in-out infinite 0s; }
      .st-sm-2 { animation: steamFloatSmall 2s ease-in-out infinite 1s; }

      .barista { animation: baristaBob 4s ease-in-out infinite; }
      .barista-arm { transform-origin: 730px 185px; animation: armMove 2s ease-in-out infinite; }
      .light-flicker { animation: flicker 4s ease-in-out infinite; }
    </style>

    <!-- Gradients & Filters -->
    <linearGradient id="windowNight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1021"/>
      <stop offset="100%" stop-color="#1b2845"/>
    </linearGradient>
    
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb703" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#ffb703" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffb703" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="40%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.6"/>
    </radialGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <clipPath id="windowClip">
      <rect x="70" y="60" width="360" height="260" rx="8" />
    </clipPath>
  </defs>

  <!-- ================= BACKGROUND (Walls & Floor) ================= -->
  <rect width="1000" height="600" fill="#2d1c15" />
  <!-- Floor -->
  <polygon points="0,350 1000,350 1000,600 0,600" fill="#21140e" />
  <!-- Baseboard -->
  <rect x="0" y="340" width="1000" height="15" fill="#140c08" />

  <!-- ================= WINDOW & WINTER SCENE ================= -->
  <!-- Window Frame Exterior -->
  <rect x="60" y="50" width="380" height="280" rx="12" fill="#140c08" />
  <!-- Glass Background -->
  <rect x="70" y="60" width="360" height="260" rx="8" fill="url(#windowNight)" />
  
  <!-- Snowflakes (Clipped to Window) -->
  <g clip-path="url(#windowClip)">
    <!-- Group 1 -->
    <circle cx="100" cy="50" r="3" class="snow s1 d-0"/>
    <circle cx="150" cy="50" r="4" class="snow s2 d-2"/>
    <circle cx="200" cy="50" r="2.5" class="snow s3 d-1"/>
    <circle cx="280" cy="50" r="4" class="snow s4 d-3"/>
    <circle cx="340" cy="50" r="3.5" class="snow s1 d-4"/>
    <circle cx="390" cy="50" r="2" class="snow s2 d-5"/>
    
    <!-- Group 2 -->
    <circle cx="120" cy="50" r="3.5" class="snow s3 d-4"/>
    <circle cx="180" cy="50" r="2" class="snow s4 d-5"/>
    <circle cx="240" cy="50" r="4" class="snow s1 d-2"/>
    <circle cx="310" cy="50" r="2.5" class="snow s2 d-0"/>
    <circle cx="370" cy="50" r="3" class="snow s3 d-1"/>
    <circle cx="80" cy="50" r="4.5" class="snow s4 d-3"/>
    
    <!-- Group 3 -->
    <circle cx="90" cy="50" r="2" class="snow s2 d-1"/>
    <circle cx="220" cy="50" r="3" class="snow s1 d-3"/>
    <circle cx="260" cy="50" r="4" class="snow s3 d-5"/>
    <circle cx="330" cy="50" r="2.5" class="snow s4 d-2"/>
    <circle cx="410" cy="50" r="3.5" class="snow s1 d-0"/>
  </g>

  <!-- Window Frame Details (Mullions) -->
  <rect x="245" y="60" width="10" height="260" fill="#140c08" />
  <rect x="70" y="185" width="360" height="10" fill="#140c08" />
  <!-- Window Ledge -->
  <rect x="50" y="330" width="400" height="15" fill="#3a251c" />

  <!-- ================= OTHER CUSTOMERS ================= -->
  <!-- Silhouettes near the window -->
  <g opacity="0.85">
    <rect x="130" y="300" width="70" height="10" fill="#140c08" /> <!-- Table -->
    <rect x="160" y="310" width="10" height="40" fill="#140c08" /> <!-- Table Leg -->
    
    <!-- Person sitting -->
    <circle cx="230" cy="245" r="22" fill="#0f0906" /> <!-- Head -->
    <rect x="205" y="270" width="50" height="70" rx="15" fill="#0f0906" /> <!-- Body -->
    
    <circle cx="110" cy="255" r="20" fill="#0f0906" /> <!-- Head 2 -->
    <rect x="90" y="280" width="45" height="60" rx="12" fill="#0f0906" /> <!-- Body 2 -->
  </g>

  <!-- ================= BARISTA & COFFEE COUNTER ================= -->
  <g class="barista">
    <!-- Barista Body -->
    <rect x="700" y="150" width="70" height="130" rx="25" fill="#1d2228" />
    <circle cx="735" cy="120" r="28" fill="#e2c2a4" /> <!-- Head -->
    <path d="M 695 190 Q 735 180 775 190 L 765 280 L 705 280 Z" fill="#4e342e" /> <!-- Apron -->
    
    <!-- Barista Arm Animated -->
    <g class="barista-arm">
      <path d="M 730 185 L 680 230 L 660 230" fill="none" stroke="#1d2228" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
      <!-- Hand / Pitcher -->
      <circle cx="650" cy="230" r="10" fill="#e2c2a4" />
      <rect x="635" y="220" width="18" height="25" fill="#cfd8dc" rx="3" />
    </g>
  </g>

  <!-- Coffee Machine -->
  <rect x="580" y="190" width="110" height="95" rx="8" fill="#78909c" /> <!-- Machine Back -->
  <rect x="570" y="195" width="130" height="30" rx="5" fill="#546e7a" /> <!-- Machine Top -->
  <rect x="590" y="285" width="90" height="10" fill="#37474f" /> <!-- Drip Tray -->
  
  <!-- Group head & Portafilter -->
  <rect x="610" y="225" width="20" height="25" fill="#37474f" />
  <path d="M 615 250 L 625 250 L 620 265 Z" fill="#212121" />
  <!-- Steam wand -->
  <path d="M 660 225 Q 670 240 665 260" fill="none" stroke="#cfd8dc" stroke-width="4" stroke-linecap="round" />
  <!-- Dials -->
  <circle cx="600" cy="210" r="6" fill="#212121" />
  <circle cx="640" cy="210" r="6" fill="#212121" />

  <!-- Machine Steam -->
  <path class="steam st-sm-1" d="M 620,260 Q 610,240 620,220" stroke-width="2" />
  <path class="steam st-sm-2" d="M 660,260 Q 670,240 660,220" stroke-width="2" />

  <!-- Counter Front & Top -->
  <rect x="520" y="295" width="480" height="25" fill="#5d4037" /> <!-- Top -->
  <rect x="520" y="320" width="480" height="280" fill="#3e2723" /> <!-- Base -->
  <rect x="520" y="320" width="20" height="280" fill="#2c1a16" /> <!-- Shadow Detail -->
  <path d="M 520 320 L 1000 320 L 1000 350 L 520 350 Z" fill="#2c1a16" opacity="0.4" /> <!-- Under-counter shadow -->

  <!-- Pastry Display (Optional Coziness) -->
  <rect x="830" y="235" width="120" height="60" fill="#fff" opacity="0.1" /> <!-- Glass -->
  <rect x="830" y="290" width="120" height="5" fill="#4e342e" />
  <ellipse cx="860" cy="275" rx="15" ry="8" fill="#d7ccc8" /> <!-- Croissant 1 -->
  <ellipse cx="900" cy="275" rx="15" ry="8" fill="#d7ccc8" /> <!-- Croissant 2 -->

  <!-- ================= LIGHTING (Pendant Lamps) ================= -->
  <!-- Lamp 1 (Over Window Table) -->
  <line x1="200" y1="0" x2="200" y2="120" stroke="#111" stroke-width="3" />
  <path d="M 170 120 L 230 120 L 210 90 L 190 90 Z" fill="#140c08" />
  <circle cx="200" cy="125" r="20" fill="#ffca28" filter="url(#glow)" class="light-flicker" />
  <!-- Simulated Light Cast -->
  <circle cx="200" cy="220" r="180" fill="url(#lampGlow)" class="light-flicker" />

  <!-- Lamp 2 (Over Counter) -->
  <line x1="720" y1="0" x2="720" y2="80" stroke="#111" stroke-width="3" />
  <path d="M 690 80 L 750 80 L 730 50 L 710 50 Z" fill="#140c08" />
  <circle cx="720" cy="85" r="20" fill="#ffca28" filter="url(#glow)" class="light-flicker" />
  <!-- Simulated Light Cast -->
  <circle cx="720" cy="180" r="180" fill="url(#lampGlow)" class="light-flicker" />

  <!-- ================= FOREGROUND (First Person Perspective) ================= -->
  <!-- Foreground Table -->
  <path d="M -50 650 L 150 480 L 850 480 L 1050 650 Z" fill="#4a2e22" />
  <!-- Table Edge Shadow -->
  <path d="M -50 650 L 150 480 L 850 480 L 1050 650 Z" fill="#1a100b" opacity="0.3" />
  <path d="M 150 480 L 850 480 L 800 485 L 200 485 Z" fill="#6d4c41" opacity="0.5" /> <!-- Highlight -->

  <!-- A Notebook (GitHub dev vibe) -->
  <polygon points="280,510 460,500 500,560 300,580" fill="#f5f5f5" />
  <polygon points="275,515 280,510 300,580 290,585" fill="#e0e0e0" /> <!-- Notebook Pages Edge -->
  <polygon points="460,500 470,505 510,565 500,560" fill="#263238" /> <!-- Notebook Cover Edge -->
  
  <!-- Some faint text lines in the notebook -->
  <line x1="320" y1="520" x2="430" y2="515" stroke="#cfd8dc" stroke-width="3" />
  <line x1="315" y1="535" x2="450" y2="525" stroke="#cfd8dc" stroke-width="3" />
  <line x1="310" y1="550" x2="400" y2="540" stroke="#cfd8dc" stroke-width="3" />
  
  <!-- Pen -->
  <polygon points="510,510 520,515 480,560 470,555" fill="#37474f" />
  <polygon points="470,555 480,560 475,565" fill="#90a4ae" /> <!-- Pen Tip -->

  <!-- The Cozy Foreground Mug -->
  <ellipse cx="730" cy="545" rx="55" ry="18" fill="#140c08" opacity="0.8" /> <!-- Shadow/Saucer -->
  <ellipse cx="725" cy="540" rx="50" ry="15" fill="#d7ccc8" /> <!-- Saucer Top -->
  
  <!-- Mug Handle -->
  <path d="M 750 490 Q 790 490 780 520 Q 765 530 750 525" fill="none" stroke="#fdfbf7" stroke-width="12" stroke-linecap="round" />
  <!-- Mug Body -->
  <rect x="670" y="465" width="75" height="70" rx="12" fill="#fdfbf7" />
  <!-- Mug Opening -->
  <ellipse cx="707.5" cy="465" rx="37.5" ry="12" fill="#eceff1" />
  <!-- Coffee Liquid inside -->
  <ellipse cx="707.5" cy="467" rx="32" ry="9" fill="#3e2723" />
  
  <!-- First Person Coffee Steam (Overlapping and Cozy) -->
  <path class="steam st-1" d="M 695,450 Q 680,410 705,370" />
  <path class="steam st-2" d="M 715,445 Q 735,405 700,365" />
  <path class="steam st-3" d="M 705,455 Q 695,420 720,380" />

  <!-- Global Vignette for mood -->
  <rect width="1000" height="600" fill="url(#vignette)" pointer-events="none" />
</svg>
